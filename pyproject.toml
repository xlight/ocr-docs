[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-docs"
version = "0.2.0"
description = "中文教育/特教文档 → 规范 Markdown 转换 + 案例→Dify 知识库预处理（清洗/拆分/元数据/脱敏）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "xlight" }]
keywords = ["ocr", "markdown", "pdf", "docling", "rapidocr", "chinese", "special-education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
]

dependencies = [
    "typer>=0.12",
    "pymupdf>=1.24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# 扫描文档转换（版面分析 + 默认 OCR 后端）
scanned = [
    "docling>=2.110",
    "rapidocr>=3.0",
]
# macOS 系统原生 OCR（高速、免下载，可选后端）
ocrmac = [
    "ocrmac>=1.0",
]
# 开发依赖
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
ocr-docs = "ocrdocs.cli:app"

[tool.setuptools.packages.find]
include = ["ocrdocs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"